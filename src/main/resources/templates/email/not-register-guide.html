<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundock 가입 정보 안내</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh;">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);">

                <tr>
                    <td style="background: #ffffff; padding: 60px 40px; text-align: center; border-bottom: 1px solid #e8ecef;">
                        <h1 style="margin: 0 0 10px 0; font-size: 42px; font-weight: 900; letter-spacing: -1.5px; color: #2c3e50;">SOUNDOCK</h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding: 60px 50px;">
                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td align="center" style="padding-bottom: 35px;">
                                    <div style="width: 85px; height: 85px; margin: 0 auto; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);">
                                        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="white"/>
                                        </svg>
                                    </div>
                                </td>
                            </tr>

                            <tr>
                                <td align="center">
                                    <h2 style="margin: 0 0 20px 0; font-size: 30px; font-weight: 800; color: #2c3e50; letter-spacing: -1px;">미가입 계정 안내</h2>
                                </td>
                            </tr>

                            <tr>
                                <td align="center">
                                    <p style="margin: 0 0 45px 0; font-size: 16px; line-height: 1.8; color: #7f8c8d; text-align: center;">
                                        요청하신 이메일(<strong style="color: #2c3e50;" th:text="${email}">user@example.com</strong>)로<br>
                                        가입된 정보가 없습니다. 🔍<br>
                                        Soundock의 새로운 가족이 되어보시는 건 어떨까요?
                                    </p>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" style="padding-bottom: 50px;">
                                    <table border="0" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td align="center" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 50px; box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);">
                                                <a th:href="${signupUrl}" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 18px 65px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; letter-spacing: -0.3px;">
                                                    회원가입하러 가기
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="background: #f8f9fa; padding: 40px 50px; text-align: center; border-top: 1px solid #e8ecef;">
                        <p style="margin: 15px 0 0 0; font-size: 11px; color: #bdc3c7; letter-spacing: 0.5px;">&copy; 2026 SOUNDOCK. All rights reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
