<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Soundock 인증 결과</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f7; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 30px; background-color: #1DB954; color: white; border-radius: 25px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon" th:text="${success ? '✅' : '❌'}"></div>
    <h2 th:text="${success ? '인증 성공!' : '인증 실패'}">결과</h2>
    <p th:text="${message}" style="color: #666; line-height: 1.5;"></p>
    <br>
    <button class="btn" onclick="window.close()">창 닫기</button>
</div>
</body>
</html>
