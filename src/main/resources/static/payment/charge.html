<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>재화 충전</title>
</head>
<body>
<h1>재화 충전</h1>

<div>
    <label>충전 금액</label>
    <select id="amount">
        <option value="10000">10,000원</option>
        <option value="50000">50,000원</option>
        <option value="100000">100,000원</option>
    </select>
</div>

<button onclick="goToPayment()">충전하기</button>

<script>
    async function goToPayment() {
        const amount = parseInt(document.getElementById('amount').value);

        try {
            // 1. prepare API 호출해서 orderId 받기
            const response = await fetch('/v1/payments/prepare', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: amount,
                    changeAmount: amount // 또는 계산된 값
                })
            });

            const data = await response.json();
            console.log('서버 데이터', data);
            const orderId = data.data.orderId; // RestResponse 구조에 맞게

            if (!orderId){
                throw new Error('orderId가 없습니다.');
            }

            // 2. orderId를 URL 파라미터로 checkout.html로 이동
            window.location.href = `/payment/checkout.html?orderId=${orderId}&amount=${amount}`;

        } catch (error) {
            alert('결제 준비 실패: ' + error.message);
        }
    }
</script>
</body>
</html>
