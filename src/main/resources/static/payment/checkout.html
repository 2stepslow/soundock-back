<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>결제 페이지</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>

    <style>
        .container { width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; text-align: center; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .pay-btn { width: 100%; padding: 15px; background-color: #3182f6; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .method-btn { padding: 10px 20px; border: 1px solid #ddd; border-radius: 5px; background-color: #ffffff; cursor: pointer; }
        .active { background-color: #e5efff; border-color: #3182f6; color: #3182f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>주문서</h2>
    <p id="order-info">주문 정보를 불러오는 중...</p>

    <h3>결제 수단 선택</h3>
    <div class="btn-group">
        <button id="btn-card" class="method-btn">카드</button>
        <button id="btn-transfer" class="method-btn">계좌이체</button>
    </div>

    <button id="btn-payment" class="pay-btn">결제하기</button>
</div>

<script>
    console.log("스크립트 로드 시작"); // 디버깅용

    // 1. URL 파라미터 파싱
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');
    const urlAmount = parseInt(urlParams.get('amount'));

    // 화면에 정보 표시
    if(orderId && urlAmount) {
        document.getElementById('order-info').innerText = `주문번호: ${orderId}\n결제금액: ${urlAmount.toLocaleString()}원`;
    }

    // 2. 토스페이먼츠 초기화
    const clientKey = "test_ck_5OWRapdA8dQKMnzQXW7X3o1zEqZK"; // 본인의 클라이언트 키 확인 필수
    const customerKey = generateRandomString();

    let tossPayments;
    let payment;

    try {
        tossPayments = TossPayments(clientKey);
        payment = tossPayments.payment({ customerKey });
        console.log("토스페이먼츠 초기화 성공");
    } catch (error) {
        console.error("토스페이먼츠 초기화 실패:", error);
        alert("결제 모듈 로딩 실패. 새로고침 해주세요.");
    }

    // 3. 결제 수단 선택 로직
    const amount = { currency: "KRW", value: urlAmount || 50000 };
    let selectedPaymentMethod = null;

    // 카드 버튼 클릭 이벤트 연결
    document.getElementById("btn-card").addEventListener("click", function() {
        selectMethod("CARD");
    });

    // 계좌이체 버튼 클릭 이벤트 연결
    document.getElementById("btn-transfer").addEventListener("click", function() {
        selectMethod("TRANSFER");
    });

    function selectMethod(method) {
        selectedPaymentMethod = method;
        console.log("선택된 결제수단:", method);

        // 스타일 변경
        document.getElementById("btn-card").className = "method-btn"; // 초기화
        document.getElementById("btn-transfer").className = "method-btn"; // 초기화

        if(method === "CARD") {
            document.getElementById("btn-card").classList.add("active");
        } else if (method === "TRANSFER") {
            document.getElementById("btn-transfer").classList.add("active");
        }
    }

    // 4. 결제하기 버튼 클릭 이벤트 연결
    document.getElementById("btn-payment").addEventListener("click", async function() {
        console.log("결제하기 버튼 클릭됨");

        if (!selectedPaymentMethod) {
            alert("결제 수단을 먼저 선택해주세요.");
            return;
        }

        if (!orderId) {
            alert("주문 번호가 없습니다. 처음부터 다시 시도해주세요.");
            return;
        }

        try {
            if (selectedPaymentMethod === "CARD") {
                await payment.requestPayment({
                    method: "CARD",
                    amount: amount,
                    orderId: orderId,
                    orderName: "재화 충전",
                    successUrl: window.location.origin + "/payment/success.html",
                    failUrl: window.location.origin + "/payment/fail.html",
                    customerEmail: "linlin@gmail.com",
                    customerName: "김토스",
                    card: {
                        useEscrow: false,
                        flowMode: "DEFAULT",
                        useCardPoint: false,
                        useAppCardOnly: false,
                    },
                });
            } else {
                alert("현재는 카드 결제만 지원합니다.");
            }
        } catch (error) {
            console.error('결제 요청 실패:', error);
            alert('결제 요청 실패: ' + error.message);
        }
    });

    function generateRandomString() {
        return window.btoa(Math.random()).slice(0, 20);
    }
</script>
</body>
</html>
