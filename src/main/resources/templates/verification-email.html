<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundock 이메일 인증</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh;">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);">

                <!-- Header -->
                <tr>
                    <td style="background: #ffffff; padding: 60px 40px; text-align: center; border-bottom: 1px solid #e8ecef;">
                        <h1 style="margin: 0 0 10px 0; font-size: 42px; font-weight: 900; letter-spacing: -1.5px; color: #2c3e50;">SOUNDOCK</h1>
                        <p style="margin: 0; font-size: 13px; letter-spacing: 2.5px; color: #7f8c8d; font-weight: 500; text-transform: uppercase;">Music Community Platform</p>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding: 60px 50px;">
                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <!-- Icon -->
                            <tr>
                                <td align="center" style="padding-bottom: 35px;">
                                    <div style="width: 85px; height: 85px; margin: 0 auto; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);">
                                        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="white"/>
                                        </svg>
                                    </div>
                                </td>
                            </tr>

                            <!-- Title -->
                            <tr>
                                <td align="center">
                                    <h2 style="margin: 0 0 20px 0; font-size: 30px; font-weight: 800; color: #2c3e50; letter-spacing: -1px;">이메일 인증</h2>
                                </td>
                            </tr>

                            <!-- Description -->
                            <tr>
                                <td align="center">
                                    <p style="margin: 0 0 45px 0; font-size: 16px; line-height: 1.8; color: #7f8c8d; text-align: center;">
                                        SOUNDOCK에 가입해주셔서 감사합니다! 🎵<br>
                                        아래 버튼을 클릭하여 이메일 인증을 완료하시면<br>
                                        음악 테이스트를 공유하는 특별한 커뮤니티를<br>
                                        바로 시작하실 수 있습니다.
                                    </p>
                                </td>
                            </tr>

                            <!-- Button -->
                            <tr>
                                <td align="center" style="padding-bottom: 50px;">
                                    <table border="0" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td align="center" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border-radius: 50px; box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);">
                                                <a th:href="${verificationUrl}" href="#" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 18px 65px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; letter-spacing: -0.3px;">
                                                    이메일 인증하기
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Divider -->
                            <tr>
                                <td style="padding: 20px 0 40px 0;">
                                    <div style="height: 1px; background: linear-gradient(to right, transparent, #e8ecef, transparent);"></div>
                                </td>
                            </tr>

                            <!-- Info Box -->
                            <tr>
                                <td>
                                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background: #f8f9fa; border-left: 4px solid #4facfe; border-radius: 12px;">
                                        <tr>
                                            <td style="padding: 28px;">
                                                <p style="margin: 0 0 12px 0; font-size: 14px; font-weight: 700; color: #2c3e50;">
                                                    <span style="margin-right: 8px;">🔒</span>보안 안내
                                                </p>
                                                <p style="margin: 0; font-size: 13px; line-height: 1.8; color: #7f8c8d;">
                                                    본인이 요청하지 않은 인증 메일이라면 무시하셔도 됩니다.<br>
                                                    인증 링크는 발송 후 <strong style="color: #2c3e50;">24시간</strong> 동안만 유효합니다.
                                                </p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background: #f8f9fa; padding: 40px 50px; text-align: center; border-top: 1px solid #e8ecef;">
                        <p style="margin: 0 0 8px 0; font-size: 12px; color: #95a5a6; line-height: 1.8;">
                            본 메일은 발신 전용입니다. 문의사항은 고객센터를 이용해주세요.
                        </p>
                        <p style="margin: 15px 0 0 0; font-size: 11px; color: #bdc3c7; letter-spacing: 0.5px;">
                            &copy; 2026 SOUNDOCK. All rights reserved.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
